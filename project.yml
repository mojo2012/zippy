name: Zippy
options:
  bundleIdPrefix: dev.zippy          # TODO: auf eigene Domain ändern
  deploymentTarget:
    macOS: "15.4"                    # FSKit gibt es ab macOS 15.4
  createIntermediateGroups: true

packages:
  ArchiveCore:
    path: ArchiveCore    # ZIP-Kern (libarchive), wird in Schritt 2/3 von den Adaptern genutzt

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_DEBUG_DYLIB: NO           # sonst scheitert die Ad-hoc-Signatur
    DEVELOPMENT_TEAM: ""             # TODO: Team-ID eintragen

targets:
  Zippy:
    type: application
    platform: macOS
    sources: [Zippy]
    info:
      path: Zippy/Info.plist
      properties:
        CFBundleDisplayName: Zippy
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: Zippy/Zippy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - target: ZippyFS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.Zippy
        ENABLE_HARDENED_RUNTIME: YES

  # FSKit-Erweiterung (ExtensionKit), landet in Zippy.app/Contents/Extensions
  ZippyFS:
    type: extensionkit-extension
    platform: macOS
    sources: [ZippyFS]
    frameworks: []
    info:
      path: ZippyFS/Info.plist
      properties:
        CFBundleDisplayName: Zippy
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSShortName: zippy
          FSSupportsBlockResources: true
          FSPersonalities:
            zippy:
              FSName: Zippy
          # Roh angehängtes Image = ganzes Gerät ohne Partitionstabelle.
          # Format wie bei Apples msdos-Modul ("Partitionless").
          FSMediaTypes:
            Partitionless:
              FSMediaProperties:
                Whole: true
                Leaf: true
              FSProbeOrder: 5000
    entitlements:
      path: ZippyFS/ZippyFS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.fskit.fsmodule: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.Zippy.ZippyFS
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
