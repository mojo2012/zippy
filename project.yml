name: Zippy
options:
  bundleIdPrefix: dev.zippy          # TODO: change to your own domain
  developmentLanguage: en            # English source strings; German in the .xcstrings catalogs
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true

packages:
  ArchiveCore:
    path: ArchiveCore    # archive core (libarchive)
  FuseMount:
    path: FuseMount      # FUSE-T / macFUSE adapter

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    ENABLE_DEBUG_DYLIB: NO           # otherwise ad-hoc signing fails
    DEVELOPMENT_TEAM: ""             # TODO: enter your team ID

targets:
  # Two interchangeable variants of the same app. Shared: Zippy/Shared (receiving
  # files, Finder windows, quitting). They differ only in which ArchiveMounting
  # implementation is added: Zippy/FUSE or Zippy/FSKit.
  # Double-click an archive → volume in Finder → eject.

  # FUSE variant: FUSE-T or macFUSE, no sandbox, no Developer account needed.
  Zippy:
    type: application
    platform: macOS
    sources: [Zippy/Shared, Zippy/FUSE, Zippy/Resources]
    info:
      path: Zippy/Info.plist
      properties: &appInfo
        CFBundleDisplayName: Zippy
        CFBundleShortVersionString: $(MARKETING_VERSION)   # otherwise XcodeGen hardcodes "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon      # scripts/make-app-icon.swift
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true              # no Dock icon, no menu bar
        NSPrincipalClass: NSApplication
        # Finder: right-click → Services. Titles translated in Zippy/Resources/ServicesMenu.xcstrings
        NSServices:
          - NSMenuItem: {default: "Password Protection with Zippy…"}
            NSMessage: passwordProtection
            NSPortName: Zippy
            NSRequiredContext: {}
            NSSendFileTypes: [public.zip-archive, com.pkware.zip-archive, org.7-zip.7-zip-archive]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIP Archive
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: zip    # Zippy/Resources/Icons
            LSHandlerRank: Alternate   # users make Zippy the default via Get Info → Open With → Change All
            LSItemContentTypes: [com.pkware.zip-archive, public.zip-archive]
          - CFBundleTypeName: TAR Archive
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: tgz
            LSHandlerRank: Alternate
            # .tar, .tgz, .tbz, .txz; .tar.gz/.tar.bz2/.tar.xz/.tar.Z are typed only as
            # gzip/bzip2/xz/compress. If there's no TAR inside, Zippy reports that it
            # can't open the archive.
            LSItemContentTypes: [public.tar-archive, org.gnu.gnu-tar-archive, org.gnu.gnu-zip-tar-archive,
                                 public.tar-bzip2-archive, org.tukaani.tar-xz-archive, org.gnu.gnu-zip-archive,
                                 public.bzip2-archive, org.tukaani.xz-archive, public.z-archive]
          - CFBundleTypeName: 7-Zip Archive
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: 7z
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.7-zip.7-zip-archive]
          - CFBundleTypeName: Split Archive
            CFBundleTypeRole: Viewer       # read-only
            LSHandlerRank: Alternate
            # Parts like Name.7z.001 or Name.r00 have no file type of their own in macOS.
            # Name.part1.rar is a regular RAR.
            CFBundleTypeExtensions: ["001", "002", "003", "r00", "r01", "r02"]
          - CFBundleTypeName: RAR Archive
            CFBundleTypeRole: Viewer       # read-only
            CFBundleTypeIconFile: rar
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rarlab.rar-archive]
          - CFBundleTypeName: SQLite Database
            CFBundleTypeRole: Viewer       # read-only: tables as CSV and DDL files
            CFBundleTypeIconFile: db
            LSHandlerRank: Alternate
            # No common UTI for SQLite files; recognized by the header when opening
            CFBundleTypeExtensions: [db, sqlite, sqlite3, db3]
    entitlements:
      path: Zippy/Zippy.entitlements
      properties:
        # libfuse-t.dylib / libfuse.2.dylib are signed by their vendors, not by us
        com.apple.security.cs.disable-library-validation: true
    dependencies:
      - package: ArchiveCore
      - package: FuseMount
      - target: ZippyThumbnails
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.Zippy
        ENABLE_HARDENED_RUNTIME: YES

  # Quick Look thumbnail extension, embedded in Zippy.app/Contents/PlugIns:
  # password-protected ZIP and 7z archives get a lock on their Finder icon.
  ZippyThumbnails:
    type: app-extension
    platform: macOS
    sources:
      - ZippyThumbnails
      - {path: Zippy/Resources/Icons/zip.icns, buildPhase: resources}
      - {path: Zippy/Resources/Icons/7z.icns, buildPhase: resources}
    dependencies:
      - package: ArchiveCore
      - sdk: QuickLookThumbnailing.framework
    info:
      path: ZippyThumbnails/Info.plist
      properties:
        CFBundleDisplayName: Zippy Thumbnails
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [public.zip-archive, com.pkware.zip-archive, org.7-zip.7-zip-archive]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: ZippyThumbnails/ZippyThumbnails.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.Zippy.Thumbnails
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # FSKit variant: own file system extension, sandboxed, App Store compatible.
  # Needs a paid Developer account (entitlement com.apple.developer.fskit.fsmodule).
  Zippy-FSKit:
    type: application
    platform: macOS
    sources: [Zippy/Shared, Zippy/FSKit, Zippy/Resources]
    info:
      path: Zippy/Info-FSKit.plist
      properties:
        <<: *appInfo
        NSServices: []                 # Finder services only in the FUSE variant, otherwise they'd show up twice
        # Shared keychain group for handing passwords to ZippyFS, e.g.
        # "TEAMID.dev.zippy.shared". Needs a team ID and keychain-access-groups in both
        # entitlements. Empty: password-protected archives are rejected.
        ZippyKeychainGroup: ""
    entitlements:
      path: Zippy/Zippy-FSKit.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - package: ArchiveCore
      - target: ZippyFS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.ZippyFSKit
        PRODUCT_NAME: Zippy-FSKit
        ENABLE_HARDENED_RUNTIME: YES

  # FSKit extension (ExtensionKit), embedded in Zippy-FSKit.app/Contents/Extensions
  ZippyFS:
    type: extensionkit-extension
    platform: macOS
    sources: [ZippyFS, Zippy/Shared/Keychain.swift]
    dependencies:
      - package: ArchiveCore
    info:
      path: ZippyFS/Info.plist
      properties:
        CFBundleDisplayName: Zippy
        CFBundleIconFile: AppIcon      # scripts/make-app-icon.swift
        ZippyKeychainGroup: ""     # same as Zippy-FSKit
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSShortName: zippy
          FSSupportsBlockResources: true
          FSPersonalities:
            zippy:
              FSName: Zippy
          # A raw attached image is a whole device without a partition table.
          # Same format as Apple's msdos module ("Partitionless").
          FSMediaTypes:
            Partitionless:
              FSMediaProperties:
                Whole: true
                Leaf: true
              FSProbeOrder: 5000
    entitlements:
      path: ZippyFS/ZippyFS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.fskit.fsmodule: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.ZippyFSKit.ZippyFS
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
