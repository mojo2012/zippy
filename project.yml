name: Zippy
options:
  bundleIdPrefix: dev.zippy          # TODO: auf eigene Domain ändern
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true

packages:
  ArchiveCore:
    path: ArchiveCore    # ZIP-Kern (libarchive)
  FuseMount:
    path: FuseMount      # Adapter auf FUSE-T

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_DEBUG_DYLIB: NO           # sonst scheitert die Ad-hoc-Signatur
    DEVELOPMENT_TEAM: ""             # TODO: Team-ID eintragen

targets:
  # Zwei austauschbare Varianten derselben App. Gemeinsam: Zippy/Shared
  # (Dateien entgegennehmen, Finder-Fenster, beenden). Unterschiedlich ist nur,
  # welche ArchiveMounting-Umsetzung dazukommt: Zippy/FUSE oder Zippy/FSKit.
  # Doppelklick auf ein ZIP → Volume im Finder → Auswerfen.

  # FUSE-Variante: FUSE-T oder macFUSE, ohne Sandbox, ohne Developer-Account.
  Zippy:
    type: application
    platform: macOS
    sources: [Zippy/Shared, Zippy/FUSE, Zippy/Resources]
    info:
      path: Zippy/Info.plist
      properties: &appInfo
        CFBundleDisplayName: Zippy
        CFBundleIconFile: AppIcon      # scripts/make-app-icon.swift
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true              # kein Dock-Symbol, kein Menü
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIP-Archiv
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: zip    # Zippy/Resources/Icons
            LSHandlerRank: Alternate   # Standard-App wird man über „Öffnen mit → Alle ändern“
            LSItemContentTypes: [com.pkware.zip-archive, public.zip-archive]
          - CFBundleTypeName: TAR-Archiv
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: tgz
            LSHandlerRank: Alternate
            # .tar, .tgz, .tbz, .txz; .tar.gz/.tar.bz2/.tar.xz/.tar.Z gelten nur als
            # gzip/bzip2/xz/compress. Ist darin kein TAR, meldet Zippy, dass es das Archiv
            # nicht öffnen kann.
            LSItemContentTypes: [public.tar-archive, org.gnu.gnu-tar-archive, org.gnu.gnu-zip-tar-archive,
                                 public.tar-bzip2-archive, org.tukaani.tar-xz-archive, org.gnu.gnu-zip-archive,
                                 public.bzip2-archive, org.tukaani.xz-archive, public.z-archive]
          - CFBundleTypeName: 7-Zip-Archiv
            CFBundleTypeRole: Viewer
            CFBundleTypeIconFile: 7z
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.7-zip.7-zip-archive]
          - CFBundleTypeName: Geteiltes Archiv
            CFBundleTypeRole: Viewer       # nur lesbar
            LSHandlerRank: Alternate
            # Teile wie Name.7z.001 oder Name.r00 haben keinen eigenen Dateityp in macOS.
            # Name.part1.rar ist ein normales RAR.
            CFBundleTypeExtensions: ["001", "002", "003", "r00", "r01", "r02"]
          - CFBundleTypeName: RAR-Archiv
            CFBundleTypeRole: Viewer       # nur lesbar
            CFBundleTypeIconFile: rar
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rarlab.rar-archive]
    entitlements:
      path: Zippy/Zippy.entitlements
      properties:
        # libfuse-t.dylib / libfuse.2.dylib sind von deren Herstellern signiert
        com.apple.security.cs.disable-library-validation: true
    dependencies:
      - package: ArchiveCore
      - package: FuseMount
      - target: ZippyPrefs              # landet in Contents/PlugIns
        embed: true
        copy:
          destination: plugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.Zippy
        ENABLE_HARDENED_RUNTIME: YES

  # Bereich in den Systemeinstellungen (.prefPane, wie macFUSE oder Wacom): Auswahl der
  # Technik. Steckt in Zippy.app; die App installiert ihn nach ~/Library/PreferencePanes.
  ZippyPrefs:
    type: bundle
    platform: macOS
    sources:
      - Zippy/PrefPane
      - path: Zippy/Resources/Icons/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: FuseMount
      - sdk: PreferencePanes.framework
    info:
      path: Zippy/PrefPane/Info.plist
      properties:
        CFBundleDisplayName: Zippy
        NSPrincipalClass: ZippyPane
        NSPrefPaneIconFile: AppIcon.icns
        NSPrefPaneIconLabel: Zippy
    settings:
      base:
        PRODUCT_NAME: Zippy
        PRODUCT_MODULE_NAME: ZippyPrefs   # sonst gleiches Swift-Modul wie die App
        SWIFT_VERSION: "5.0"              # NSPreferencePane ist nicht für Swift-6-Nebenläufigkeit annotiert
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.Zippy.prefpane
        WRAPPER_EXTENSION: prefPane
        SKIP_INSTALL: YES

  # FSKit-Variante: eigene Dateisystem-Erweiterung, Sandbox, App-Store-tauglich.
  # Braucht einen bezahlten Developer-Account (Recht com.apple.developer.fskit.fsmodule).
  Zippy-FSKit:
    type: application
    platform: macOS
    sources: [Zippy/Shared, Zippy/FSKit, Zippy/Resources]
    info:
      path: Zippy/Info-FSKit.plist
      properties:
        <<: *appInfo
        # Gemeinsamer Schlüsselbund für die Passwort-Übergabe an ZippyFS, z. B.
        # "TEAMID.dev.zippy.shared". Braucht Team-ID und in beiden Entitlements
        # keychain-access-groups. Leer: passwortgeschützte Archive werden abgelehnt.
        ZippyKeychainGroup: ""
    entitlements:
      path: Zippy/Zippy-FSKit.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - package: ArchiveCore
      - target: ZippyFS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.ZippyFSKit
        PRODUCT_NAME: Zippy-FSKit
        ENABLE_HARDENED_RUNTIME: YES

  # FSKit-Erweiterung (ExtensionKit), landet in Zippy-FSKit.app/Contents/Extensions
  ZippyFS:
    type: extensionkit-extension
    platform: macOS
    sources: [ZippyFS, Zippy/Shared/Keychain.swift]
    dependencies:
      - package: ArchiveCore
    info:
      path: ZippyFS/Info.plist
      properties:
        CFBundleDisplayName: Zippy
        CFBundleIconFile: AppIcon      # scripts/make-app-icon.swift
        ZippyKeychainGroup: ""     # wie bei Zippy-FSKit
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.fskit.fsmodule
          FSShortName: zippy
          FSSupportsBlockResources: true
          FSPersonalities:
            zippy:
              FSName: Zippy
          # Roh angehängtes Image = ganzes Gerät ohne Partitionstabelle.
          # Format wie bei Apples msdos-Modul ("Partitionless").
          FSMediaTypes:
            Partitionless:
              FSMediaProperties:
                Whole: true
                Leaf: true
              FSProbeOrder: 5000
    entitlements:
      path: ZippyFS/ZippyFS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.fskit.fsmodule: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zippy.ZippyFSKit.ZippyFS
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
